<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Awesome Personalized Alignment — Paper Collection</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --color-bg: #ffffff;
    --color-bg-secondary: #f5f4f0;
    --color-text-primary: #1a1a18;
    --color-text-secondary: #6b6a65;
    --color-text-tertiary: #9e9d99;
    --color-border: rgba(0,0,0,0.12);
    --color-border-hover: rgba(0,0,0,0.22);
    --radius-md: 8px;
    --radius-lg: 12px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --color-bg: #1c1c1a;
      --color-bg-secondary: #252523;
      --color-text-primary: #f0ede8;
      --color-text-secondary: #9e9d99;
      --color-text-tertiary: #6b6a65;
      --color-border: rgba(255,255,255,0.1);
      --color-border-hover: rgba(255,255,255,0.2);
    }
  }

  body {
    font-family: var(--font-sans);
    background: var(--color-bg);
    color: var(--color-text-primary);
    line-height: 1.6;
    min-height: 100vh;
  }

  .page { max-width: 860px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }

  .header { padding-bottom: 1.5rem; border-bottom: 0.5px solid var(--color-border); margin-bottom: 1.5rem; }
  .header-top { display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 1rem; margin-bottom: 1rem; }
  .title-block h1 { font-size: 22px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 6px; }
  .title-block p { font-size: 14px; color: var(--color-text-secondary); max-width: 560px; line-height: 1.6; }

  .stats { display: flex; gap: 10px; flex-wrap: wrap; flex-shrink: 0; }
  .stat { background: var(--color-bg-secondary); border-radius: var(--radius-md); padding: 10px 16px; text-align: center; }
  .stat-num { font-size: 20px; font-weight: 500; }
  .stat-label { font-size: 11px; color: var(--color-text-secondary); margin-top: 2px; }

  .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 1rem; }
  .search-wrap { flex: 1; min-width: 200px; }
  .search-wrap input {
    width: 100%; height: 36px; padding: 0 12px; font-size: 14px;
    font-family: var(--font-sans); border: 0.5px solid var(--color-border-hover);
    border-radius: var(--radius-md); background: var(--color-bg); color: var(--color-text-primary);
    outline: none; transition: border-color 0.15s;
  }
  .search-wrap input:focus { border-color: #7F77DD; }
  .search-wrap input::placeholder { color: var(--color-text-tertiary); }

  .tag-filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag-btn {
    font-size: 12px; font-family: var(--font-sans); padding: 5px 12px; border-radius: 999px;
    border: 0.5px solid var(--color-border-hover); background: transparent;
    color: var(--color-text-secondary); cursor: pointer; transition: all 0.15s;
  }
  .tag-btn:hover { background: var(--color-bg-secondary); }
  .tag-btn.active { background: #3C3489; border-color: #3C3489; color: #EEEDFE; }

  .count-label { font-size: 13px; color: var(--color-text-secondary); margin-bottom: 1rem; }

  .section-divider {
    font-size: 12px; font-weight: 500; color: var(--color-text-secondary);
    letter-spacing: 0.08em; text-transform: uppercase;
    padding: 12px 0 6px; border-bottom: 0.5px solid var(--color-border);
    margin-bottom: 8px; margin-top: 4px;
  }

  .papers-grid { display: grid; grid-template-columns: 1fr; gap: 6px; }
  .paper-card {
    display: flex; align-items: flex-start; gap: 12px;
    background: var(--color-bg); border: 0.5px solid var(--color-border);
    border-radius: var(--radius-lg); padding: 14px 16px;
    text-decoration: none; color: inherit; transition: border-color 0.15s, background 0.15s;
  }
  .paper-card:hover { border-color: var(--color-border-hover); background: var(--color-bg-secondary); }
  .paper-left { flex: 1; min-width: 0; }
  .paper-title { font-size: 14px; font-weight: 500; color: var(--color-text-primary); line-height: 1.5; margin-bottom: 8px; }
  .paper-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

  .year-badge { font-size: 11px; padding: 3px 8px; border-radius: 999px; font-weight: 500; }
  .y2026 { background: #EEEDFE; color: #3C3489; }
  .y2025 { background: #E1F5EE; color: #0F6E56; }
  .y2024 { background: #E6F1FB; color: #185FA5; }
  .y2023 { background: #FAEEDA; color: #854F0B; }

  @media (prefers-color-scheme: dark) {
    .y2026 { background: #26215C; color: #CECBF6; }
    .y2025 { background: #04342C; color: #9FE1CB; }
    .y2024 { background: #042C53; color: #B5D4F4; }
    .y2023 { background: #412402; color: #FAC775; }
  }

  .paper-tag { font-size: 11px; padding: 3px 8px; border-radius: 999px; background: var(--color-bg-secondary); color: var(--color-text-secondary); }
  .paper-arrow { font-size: 14px; color: var(--color-text-tertiary); flex-shrink: 0; margin-top: 3px; }
  .no-results { text-align: center; padding: 3rem 0; color: var(--color-text-secondary); font-size: 14px; }

  .loading {
    text-align: center; padding: 4rem 0;
    color: var(--color-text-secondary); font-size: 14px;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
  }
  .spinner {
    width: 24px; height: 24px;
    border: 2px solid var(--color-border);
    border-top-color: #7F77DD;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error-msg {
    text-align: center; padding: 3rem 0;
    color: var(--color-text-secondary); font-size: 14px;
  }
  .error-msg a { color: #7F77DD; text-decoration: none; }
  .error-msg a:hover { text-decoration: underline; }

  .source-badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; color: var(--color-text-tertiary);
    border: 0.5px solid var(--color-border);
    border-radius: 999px; padding: 3px 10px;
    text-decoration: none; transition: color 0.15s, border-color 0.15s;
    margin-top: 6px;
  }
  .source-badge:hover { color: var(--color-text-secondary); border-color: var(--color-border-hover); }
</style>
</head>
<body>
<div class="page">

  <div class="header">
    <div class="header-top">
      <div class="title-block">
        <h1>Awesome Personalized Alignment</h1>
        <p>A curated collection of research on aligning LLMs with individual preferences.</p>
        <a class="source-badge"
           href="https://github.com/liyongqi2002/Awesome-Personalized-Alignment"
           target="_blank" rel="noopener noreferrer">
          ↗ Auto-synced from GitHub README
        </a>
      </div>
      <div class="stats">
        <div class="stat"><div class="stat-num" id="total-count">—</div><div class="stat-label">Papers</div></div>
        <div class="stat"><div class="stat-num" id="year-range">—</div><div class="stat-label">Coverage</div></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="search-wrap">
      <input type="text" id="search" placeholder="Search titles..." oninput="filterPapers()" />
    </div>
    <div class="tag-filters" id="tag-filters"></div>
  </div>

  <div class="count-label" id="count-label"></div>
  <div class="papers-grid" id="papers-grid">
    <div class="loading">
      <div class="spinner"></div>
      <span>Fetching papers from GitHub...</span>
    </div>
  </div>

</div>
<script>
// ─── CONFIG ──────────────────────────────────────────────────────────────────
// GitHub raw URL of the README to fetch
const README_URL = "https://raw.githubusercontent.com/liyongqi2002/Awesome-Personalized-Alignment/main/README.md";

// How to map README section headings → tags shown in the UI
// Key: substring to match in the ### heading (case-insensitive)
// Value: tag label(s) to apply
const SECTION_TAG_MAP = [
  { match: "survey",      tag: "Survey"      },
  { match: "position",    tag: "Survey"      },
  { match: "benchmark",   tag: "Benchmark"   },
  { match: "reward",      tag: "Reward Model"},
  { match: "memory",      tag: "Memory"      },
  { match: "multimodal",  tag: "Multimodal"  },
  { match: "safety",      tag: "Safety"      },
];

// Ordered list of tags shown in the filter bar
const DEFINED_TAGS = ["Survey", "Benchmark", "Reward Model", "Memory", "Multimodal", "Safety"];

// ─── PARSER ──────────────────────────────────────────────────────────────────
/**
 * Parse the README markdown and return an array of paper objects:
 *   { title, year, url, tags }
 *
 * Recognises lines matching:
 *   - [YYYY/MM] **[Title](url)**  (any optional trailing text / tags ignored)
 *   - [YYYY/MM] **[Title](url)** [extra tag]   ← the bracketed extra is ignored
 */
function parseReadme(text) {
  const papers = [];
  const lines = text.split("\n");

  // Track current section heading (### …) to derive tags
  let currentSectionTags = [];

  // Regex for a paper entry line
  // Group 1: year (4 digits), Group 2: title, Group 3: url
  const paperRe = /^\s*-\s+\[(\d{4})\/\d{2}\]\s+\*\*\[(.+?)\]\((.+?)\)\*\*/;

  // Regex for a section heading (### …)
  const sectionRe = /^###\s+(.+)/;

  for (const line of lines) {
    // Update section if we hit a ### heading
    const secMatch = line.match(sectionRe);
    if (secMatch) {
      const heading = secMatch[1].toLowerCase();
      currentSectionTags = SECTION_TAG_MAP
        .filter(({ match }) => heading.includes(match))
        .map(({ tag }) => tag);
      // Deduplicate
      currentSectionTags = [...new Set(currentSectionTags)];
      continue;
    }

    // Skip commented-out lines (<!-- … -->)
    if (line.trim().startsWith("<!--")) continue;

    // Match a paper line
    const m = line.match(paperRe);
    if (!m) continue;

    const year = parseInt(m[1], 10);
    const title = m[2].trim();
    const url   = m[3].trim();

    // Avoid exact duplicates (same title + url)
    const isDupe = papers.some(p => p.url === url && p.title === title);
    if (isDupe) continue;

    papers.push({ title, year, url, tags: [...currentSectionTags] });
  }

  return papers;
}

// ─── STATE ───────────────────────────────────────────────────────────────────
let papers = [];
let activeTag = null;

// ─── RENDER ──────────────────────────────────────────────────────────────────
function yearClass(y) {
  if (y >= 2026) return "y2026";
  if (y === 2025) return "y2025";
  if (y === 2024) return "y2024";
  return "y2023";
}

function buildTagFilters() {
  const container = document.getElementById("tag-filters");
  container.innerHTML = "";
  DEFINED_TAGS.forEach(tag => {
    const btn = document.createElement("button");
    btn.className = "tag-btn";
    btn.textContent = tag;
    btn.onclick = () => {
      activeTag = activeTag === tag ? null : tag;
      document.querySelectorAll(".tag-btn").forEach(b => b.classList.remove("active"));
      if (activeTag) btn.classList.add("active");
      filterPapers();
    };
    container.appendChild(btn);
  });
}

function filterPapers() {
  const query = document.getElementById("search").value.toLowerCase();
  const grid  = document.getElementById("papers-grid");
  grid.innerHTML = "";

  const filtered = papers.filter(p => {
    const matchSearch = !query || p.title.toLowerCase().includes(query);
    const matchTag    = !activeTag || p.tags.includes(activeTag);
    return matchSearch && matchTag;
  });

  document.getElementById("count-label").textContent =
    `Showing ${filtered.length} of ${papers.length} papers`;

  if (filtered.length === 0) {
    grid.innerHTML = '<div class="no-results">No papers match your search.</div>';
    return;
  }

  // Group by year, newest first
  const byYear = {};
  filtered.forEach(p => {
    if (!byYear[p.year]) byYear[p.year] = [];
    byYear[p.year].push(p);
  });

  Object.keys(byYear).sort((a, b) => b - a).forEach(year => {
    const divider = document.createElement("div");
    divider.className = "section-divider";
    divider.textContent = year;
    grid.appendChild(divider);

    byYear[year].forEach(p => {
      const card = document.createElement("a");
      card.className = "paper-card";
      card.href = p.url;
      card.target = "_blank";
      card.rel = "noopener noreferrer";

      const left  = document.createElement("div");
      left.className = "paper-left";

      const title = document.createElement("div");
      title.className = "paper-title";
      title.textContent = p.title;

      const meta  = document.createElement("div");
      meta.className = "paper-meta";

      const yb = document.createElement("span");
      yb.className = `year-badge ${yearClass(p.year)}`;
      yb.textContent = p.year;
      meta.appendChild(yb);

      p.tags.forEach(t => {
        const tb = document.createElement("span");
        tb.className = "paper-tag";
        tb.textContent = t;
        meta.appendChild(tb);
      });

      left.appendChild(title);
      left.appendChild(meta);

      const arrow = document.createElement("div");
      arrow.className = "paper-arrow";
      arrow.textContent = "↗";

      card.appendChild(left);
      card.appendChild(arrow);
      grid.appendChild(card);
    });
  });
}

function updateStats() {
  document.getElementById("total-count").textContent = papers.length;
  if (papers.length > 0) {
    const years = papers.map(p => p.year);
    const minY  = Math.min(...years);
    const maxY  = Math.max(...years);
    document.getElementById("year-range").textContent =
      minY === maxY ? String(minY) : `${minY}–${maxY}`;
  }
}

// ─── FETCH & INIT ─────────────────────────────────────────────────────────────
async function init() {
  const grid = document.getElementById("papers-grid");
  try {
    const res = await fetch(README_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();

    papers = parseReadme(text);

    if (papers.length === 0) {
      grid.innerHTML = `
        <div class="error-msg">
          Parsed 0 papers — the README format may have changed.<br>
          <a href="https://github.com/liyongqi2002/Awesome-Personalized-Alignment" target="_blank">View on GitHub ↗</a>
        </div>`;
      return;
    }

    buildTagFilters();
    updateStats();
    filterPapers();

  } catch (err) {
    console.error("Failed to fetch README:", err);
    grid.innerHTML = `
      <div class="error-msg">
        Could not load papers from GitHub (${err.message}).<br>
        <a href="https://github.com/liyongqi2002/Awesome-Personalized-Alignment" target="_blank">View the repository directly ↗</a>
      </div>`;
  }
}

init();
</script>
</body>
</html>
